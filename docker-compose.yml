name: repunto

services:
  postgres:
    image: postgres:16-alpine
    container_name: repunto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repunto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repunto_local}
      POSTGRES_DB: ${POSTGRES_DB:-repunto}
      # Todo timestamp se guarda en UTC; los cortes de dia se calculan en
      # America/La_Paz en el codigo, no en la base (CLAUDE.md, INV-21).
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - repunto_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-repunto} -d ${POSTGRES_DB:-repunto}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repunto_postgres:
